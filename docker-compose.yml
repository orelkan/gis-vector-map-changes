# Local development stack: Airflow 3.3.1 (LocalExecutor -- no Celery/Redis,
# per project scope control), PostgreSQL+PostGIS (one instance, two
# databases: Airflow's own metadata DB and our `gis` application DB), and
# MinIO (S3-compatible object storage for immutable snapshot files).
#
# Adapted from the official Airflow 3.3.1 docker-compose.yaml
# (https://airflow.apache.org/docs/apache-airflow/3.3.1/docker-compose.yaml):
# CeleryExecutor/redis/worker/flower removed (this project explicitly does
# not use distributed workers), postgres/minio services added, and the
# Airflow image is now built from the local Dockerfile (extends the
# official image with this project's business-logic dependencies --
# geopandas/shapely/pyproj/etc -- that DAG/task code imports).
#
# WARNING: local development only. Do not use as-is in production.
#
# NOTE on MinIO image pinning: the upstream minio/minio and minio/mc Docker
# Hub repositories were archived in 2025/2026 and no longer receive new
# releases (community forks exist but aren't used here to keep provenance
# simple for a local learning project). Pinned to the last official release
# tags -- fine for local, non-internet-facing dev use; revisit if this
# project is ever deployed anywhere that matters.
---
x-airflow-common:
  &airflow-common
  build: .
  image: ${AIRFLOW_IMAGE_NAME:-gis-vector-map-changes/airflow:3.3.1}
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # Lets DAG/task code do `from src.ingestion... import ...`.
    PYTHONPATH: /opt/airflow
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/src:/opt/airflow/src
    - ${AIRFLOW_PROJ_DIR:-.}/aoi:/opt/airflow/aoi:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      GIS_DB_NAME: ${GIS_DB_NAME:-gis}
      GIS_DB_USER: ${GIS_DB_USER:-gis}
      GIS_DB_PASSWORD: ${GIS_DB_PASSWORD:-gis}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-gis-vector-map-changes}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u)
        fi
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow db migrate

        # Airflow Connections for the two things ingestion tasks talk to,
        # per CLAUDE.md: "Store credentials in Airflow Connections... never
        # in source control." Values come from .env via env_file above.
        # `|| true` makes this safe to re-run (connection already exists).
        # Connection *names* (not the credentials behind them) come from
        # .env too, matching what dags/ingest_osm_building_snapshots.py
        # reads -- keeps the two sides bound to the same names without
        # duplicating them as separate hardcoded strings.
        /entrypoint airflow connections add "$$MINIO_AIRFLOW_CONN_ID" \
          --conn-type aws \
          --conn-extra "{\"aws_access_key_id\": \"$$MINIO_ROOT_USER\", \"aws_secret_access_key\": \"$$MINIO_ROOT_PASSWORD\", \"endpoint_url\": \"http://minio:9000\"}" \
          || true

        /entrypoint airflow connections add "$$GIS_POSTGRES_AIRFLOW_CONN_ID" \
          --conn-type postgres \
          --conn-host postgres \
          --conn-port 5432 \
          --conn-schema "$$GIS_DB_NAME" \
          --conn-login "$$GIS_DB_USER" \
          --conn-password "$$GIS_DB_PASSWORD" \
          || true

        if [[ -n "${_AIRFLOW_WWW_USER_USERNAME}" ]]; then
          /entrypoint airflow users create \
            --username "${_AIRFLOW_WWW_USER_USERNAME}" \
            --password "${_AIRFLOW_WWW_USER_PASSWORD}" \
            --firstname Admin --lastname User --role Admin \
            --email admin@example.com || true
        fi
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    depends_on:
      <<: *airflow-common-depends-on
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  minio-data:
